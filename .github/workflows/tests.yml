name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same as the test jobs: 3.14 is what the VPS runs and the lock targets.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      # The lock first, so CI tests exactly what production installs; the dev
      # tooling then resolves around it (docs/OPERATIONS.md, "Dependency lock").
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: pre-commit run --all-files
      # Not a pre-commit hook (see .pre-commit-config.yaml) — runs here instead.
      - run: mypy web

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      # The lock first, so CI tests exactly what production installs; the dev
      # tooling then resolves around it (docs/OPERATIONS.md, "Dependency lock").
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m "not browser and not integration" --cov=web

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      # The lock first, so CI tests exactly what production installs; the dev
      # tooling then resolves around it (docs/OPERATIONS.md, "Dependency lock").
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m pytest -m browser --browser chromium
