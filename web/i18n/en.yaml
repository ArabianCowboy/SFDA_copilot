# SFDA Copilot — English catalogue
#
# Two subtrees, deliberately:
#   runtime:  exported to the browser as window.__I18N (JS-facing strings only)
#   page:     server-rendered via {{ t('page....') }}, never sent to JS
#
# IMPORTANT: several values below are asserted verbatim by the Playwright suite
# (web/tests/test_frontend.py, test_theme_toggle.py). Changing their wording is
# a test change, not just a copy change. They are marked "frozen".

runtime:
  chat:
    send: "Send"                                        # frozen
    cancel: "Cancel"
    sendAria: "Send message"                            # frozen
    cancelAria: "Cancel message"                         # frozen
    sendFailed: "Failed to send message."                # frozen
    cancelled: "Chat request cancelled."                 # frozen
    loginRequired: "Please log in to chat with the AI."  # frozen
    sessionUnverified: "Unable to verify your session. Please try again."  # frozen
    genericError: "Sorry, I encountered an error while processing your request. Please try again."  # frozen (prefix)
    invalidResponse: "Invalid response format from AI service."
    stopped: "Stopped"
    incomplete: "Answer incomplete — something went wrong"
    askPrefix: "Ask: {question}"
    jumpToLatest: "Jump to latest"
    jumpToLatestAria: "Scroll to the latest message"
    cleared: "Conversation cleared"
    undo: "Undo"
    restored: "Conversation restored"
    resetFailed: "Could not start a new chat. Your conversation is unchanged."
    # Deliberately NOT resetFailed: by the time an undo can fail, the reset has
    # already stood, so telling the reader their conversation is unchanged would
    # be the opposite of what happened.
    restoreFailed: "Could not restore the previous conversation."

  stage:
    searching: "Searching the guidelines"
    retrieved: "Found {count} passages"
    retrievedOne: "Found {count} passage"
    drafting: "Drafting the answer"
    finalizing: "Finishing up"

  robot:
    idle: "Ready to help"                                # frozen
    thinking: "Processing your question..."
    talking: "Here's what I found"
    happy: "Great question!"
    error: "Something went wrong"
    searching: "Searching the guidelines..."
    retrieved: "Reading the passages..."
    draftingStatus: "Drafting the answer..."
    finalizingStatus: "Finishing up..."
    foundPassages: "Found {count} passages"
    foundPassage: "Found {count} passage"
    farewell: "See you in the chat"

  auth:
    loggedInAs: "Logged in as: {email}"                  # frozen
    notLoggedIn: "Not logged in"
    invalidCredentials: "Incorrect email or password."   # frozen
    emailNotConfirmed: "Please confirm your email before logging in."
    alreadyRegistered: "This email is already registered. Please log in."
    invalidEmail: "Please provide a valid email address."
    checkingStatus: "Checking status..."
    servicesUnavailable: "Authentication services are not configured."
    initFailed: "Failed to initialize core application services."

  profile:
    loadFailed: "Failed to load your profile."
    saveFailed: "Failed to save your profile."
    saved: "Profile saved."

  faq:
    loadFailed: "Failed to load FAQs."
    loadFailedTesting: "Failed to load FAQs in testing mode."
    empty: "No FAQs available."

  theme:
    announced: "Theme changed to {mode} mode"            # frozen
    light: "light"
    dark: "dark"

  cite:
    marker: "Source {n}"
    sourcesOne: "{n} source"
    sourcesMany: "{n} sources"
    answerComplete: "Answer complete."
    # Counts the CITED passages. It used to be read out with the RETRIEVED
    # count, so it told a screen reader that a refusal had cited eight sources.
    answerCompleteWithSources: "Answer complete. {n} sources cited."
    # The trigger. "document" is a file, "passage" is a chunk of one — never
    # use them interchangeably, and never report a passage count as documents.
    sourcesLabel: "Sources"
    docsOne: "1 document"
    docsMany: "{n} documents"
    passagesOne: "1 passage"
    passagesMany: "{n} passages"
    # The panel.
    panelTitle: "Sources for this answer"
    page: "Page {n}"
    pageShort: "p.{n}"
    pageUnknown: "No page cited"
    tabAria: "Source {n}, page {page}"
    tabAriaNoPage: "Source {n}, no page cited"
    closePassage: "Close passage"
    unknownDocument: "Unknown document"
    close: "Close sources"
    # Raw retrieval figures. Named as diagnostics, not confidence, because that
    # is what they are — no percentages, no bars.
    diagnostics: "Retrieval diagnostics"
    diagnosticsNote: "Ranking figures used to order these passages. They are not a measure of accuracy or of how well a passage supports the answer."
    combinedMatch: "Combined"
    semanticMatch: "Semantic"
    keywordMatch: "Keyword"

  lang:
    switchAria: "Switch language"
    toArabic: "التبديل إلى العربية"
    toEnglish: "Switch to English"

  # Console strings the browser draws. Kept apart from page.admin because only
  # the runtime slice is inlined as window.__I18N — and this block ships to
  # /admin alone, never to the anonymous landing page.
  admin:
    accessDenied: "This console is for administrators."
    accessCheckFailed: "Could not confirm your access. Reload to try again."
    signedOut: "You are not signed in. Sign in on the chat page first."
    signedInAs: "Signed in as {email}"
    roleLabel: "Role"
    empty: "Nothing here yet."
    settings:
      heading: "Generation"
      hint: "Applies to answers from here on. Conversations already streaming finish on the previous settings."
      model: "Model"
      temperature: "Temperature"
      maxTokens: "Maximum answer length"
      maxContextResults: "Passages per answer"
      save: "Save changes"
      saving: "Saving…"
      saved: "Settings saved."
      savedNotApplied: "Saved, but not applied to answers yet. The previous settings are still live."
      usingDefault: "Deployed default"
      overridden: "Changed here"
      revert: "Revert to default"
      loadFailed: "Could not load settings."
      saveFailed: "Could not save settings."
    errors:
      not_allowed: "Not one of the available choices."
      above_ceiling: "Too large. The most this allows is {limit}."
      out_of_range: "Must be between {limit}."
      not_a_number: "Must be a number."
      not_a_positive_integer: "Must be a whole number above zero."
      unknown_setting: "Not a setting this console recognises."
      storage_unavailable: "Settings storage is unavailable, so nothing was saved."
page:
  meta:
    title: "SFDA Copilot"
    description: "SFDA Copilot - AI-powered regulatory guidance for pharmaceutical regulations in Saudi Arabia"

  brand:
    name: "SFDA Copilot"
    # The wordmark's counterpart in the other script. The hero sets the two
    # together, because full EN/AR parity is a binding brand commitment and
    # the mark should state it rather than the copy claiming it.
    nameOther: "مساعد الغذاء والدواء الذكي"
    tagline: "Your AI Regulatory Assistant"

  landing:
    greeting: "Ready when you are"
    lead: "Ask a question instead of searching the guidelines — and see exactly which official SFDA document each answer came from."
    cta: "Get Started"
    hubLink: "AI Fouda Hub Website"
    linkedinLink: "Mohamed Fouda's LinkedIn"
    # PRODUCT.md, Principle 2: the name contains "SFDA", so every surface
    # carries the burden of saying this is not the SFDA. Not optional copy.
    notice: "<strong>SFDA Copilot is an independent tool.</strong> It is not affiliated with, endorsed by, or operated by the Saudi Food and Drug Authority. It reads the SFDA's published guidelines and shows you where each answer comes from, so you can verify it against the official source."
    version: "Version {v}"
    builtBy: "Built by Mohamed Fouda"

  features:
    heading: "What it does"
    coverage:
      title: "The Guideline Corpus"
      # No guideline count, deliberately: the corpus changes on every ingest and
      # any hard number goes stale in place. See PRODUCT.md, Evidence on Hand.
      body: "Regulatory, pharmacovigilance, veterinary medicines and biological products — the official SFDA guidelines, indexed and searchable in one place."
      badge: "Guidelines current through August 2026"
    authoritative:
      title: "Sourced to the Page"
      body: "Every answer carries numbered citations that resolve to the source guideline and its page, so you can check the original before you rely on it."
    streamlined:
      title: "Straight to the Requirement"
      body: "Find the registration procedures and requirements you need without reading the guidelines end to end."
    accuracy:
      title: "Arabic and English"
      body: "Ask in either language and the answer comes back in that language, from the same corpus. Arabic is not a translation layer."
    search:
      title: "Ask in Plain Language"
      body: "Put the question the way you would ask a colleague, and scope it to regulatory, pharmacovigilance, veterinary or biological products."

  nav:
    menu: "Menu"
    toggleNav: "Toggle navigation"
    toggleTheme: "Toggle theme"
    toggleThemeLong: "Toggle theme between light and dark"
    close: "Close"
    assistantStatus: "Assistant status"
    utilityAria: "Language and theme"
    mobileNavAria: "Mobile navigation"
    sidebarAria: "Sidebar"

  auth:
    modalTitle: "Welcome to SFDA Copilot"
    login: "Login"
    signup: "Signup"
    email: "Email address"
    password: "Password"
    passwordHint: "Min. 8 chars, 1 uppercase, 1 lowercase, 1 number."
    emailInvalid: "Please provide a valid email."
    passwordRequired: "Password is required."
    passwordInvalid: "Password must meet the requirements."
    loginSignup: "Login / Signup"
    logout: "Logout"

  profile:
    heading: "Edit Your Profile"
    button: "Profile"
    fullName: "Full Name"
    organization: "Organization"
    specialization: "Specialization"
    themePreference: "Theme Preference"
    light: "Light"
    dark: "Dark"
    save: "Save Changes"

  chat:
    welcomeLead: "Welcome to"
    welcomeRest: "! Your AI assistant for pharmaceutical regulations in Saudi Arabia. You can:"
    bullet1: "Ask specific questions about regulatory requirements"
    bullet2: "Select a category to focus your search"
    bullet3: "Click on FAQ buttons for common questions"
    cutoff: "SFDA Copilot provides regulatory guidance based on official SFDA guidelines current through August 2026. For the most recent regulatory updates and post-August 2026 changes, please consult the official SFDA website."
    prompt: "How can I assist you today?"
    newChat: "New chat"
    newChatTitle: "Start a new conversation"
    searchIn: "Search in:"
    inputPlaceholder: "Ask about SFDA regulations..."
    inputAria: "Chat message input"
    send: "Send"
    sendAria: "Send message"

  categories:
    aria: "Search category"
    all: "All Categories"
    regulatory: "Regulatory"
    pharmacovigilance: "Pharmacovigilance"
    veterinary: "Veterinary Medicines"
    biological: "Biological Products"

  # The operator console. Server-rendered chrome only — page.* never reaches
  # the browser (test_rtl.py asserts it), so anything JS must draw belongs
  # under runtime.admin instead.
  admin:
    title: "Administration · SFDA Copilot"
    consoleLabel: "Administration"
    skipToContent: "Skip to console"
    backToChat: "Back to chat"
    checking: "Checking your access…"
    sectionsAria: "Console sections"
    tabs:
      overview: "Overview"
      settings: "Settings"
      people: "People"
