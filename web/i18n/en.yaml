      actionEmailChangeAccepted: "Email address changed"
      actionEmailChangeFailed: "Email change failed"
      actionEmailChangeUnknown: "Email change — outcome unknown"
      actionNotificationCreate: "Sent a notification"
      actionNotificationDeactivate: "Deactivated a notification"
      actionNotificationDelete: "Deleted a notification"
    account:
      back: "Back to all users"
      identityHeading: "Identity"
      profileHeading: "Profile"
      activityHeading: "Activity on this account"
      created: "Created"
      lastSignIn: "Last signed in"
      lastSeen: "Last active"
      disabledAt: "Disabled at"
      confirmed: "Email confirmed"
      notConfirmed: "Not confirmed"
