page:
  meta:
    title: "SFDA Copilot"
    description: "SFDA Copilot - AI-powered regulatory guidance for pharmaceutical regulations in Saudi Arabia"

  brand:
    name: "SFDA Copilot"
    # The wordmark's counterpart in the other script. The hero sets the two
    # together, because full EN/AR parity is a binding brand commitment and
    # the mark should state it rather than the copy claiming it.
    nameOther: "مساعد الغذاء والدواء الذكي"
    tagline: "Your AI Regulatory Assistant"

  landing:
    greeting: "Ready when you are"
    lead: "Ask a question instead of searching the guidelines — and see exactly which official SFDA document each answer came from."
    cta: "Get Started"
    hubLink: "AI Fouda Hub Website"
    linkedinLink: "Mohamed Fouda's LinkedIn"
    # PRODUCT.md, Principle 2: the name contains "SFDA", so every surface
    # carries the burden of saying this is not the SFDA. Not optional copy.
    notice: "<strong>SFDA Copilot is an independent tool.</strong> It is not affiliated with, endorsed by, or operated by the Saudi Food and Drug Authority. It reads the SFDA's published guidelines and shows you where each answer comes from, so you can verify it against the official source."
    version: "Version {v}"
    builtBy: "Built by Mohamed Fouda"

  features:
    heading: "What it does"
    coverage:
      title: "The Guideline Corpus"
      # No guideline count, deliberately: the corpus changes on every ingest and
      # any hard number goes stale in place. See PRODUCT.md, Evidence on Hand.
      body: "Regulatory, pharmacovigilance, veterinary medicines and biological products — the official SFDA guidelines, indexed and searchable in one place."
      badge: "Guidelines current through August 2026"
    authoritative:
      title: "Sourced to the Page"
      body: "Every answer carries numbered citations that resolve to the source guideline and its page, so you can check the original before you rely on it."
    streamlined:
      title: "Straight to the Requirement"
      body: "Find the registration procedures and requirements you need without reading the guidelines end to end."
    accuracy:
      title: "Arabic and English"
      body: "Ask in either language and the answer comes back in that language, from the same corpus. Arabic is not a translation layer."
    search:
      title: "Ask in Plain Language"
      body: "Put the question the way you would ask a colleague, and scope it to regulatory, pharmacovigilance, veterinary or biological products."

  nav:
    menu: "Menu"
    toggleNav: "Toggle navigation"
    toggleTheme: "Toggle theme"
    toggleThemeLong: "Toggle theme between light and dark"
    close: "Close"
    assistantStatus: "Assistant status"
    utilityAria: "Language and theme"
    mobileNavAria: "Mobile navigation"
    sidebarAria: "Sidebar"

  # Server-rendered halves of the conversation sidebar. The tab LABELS live here
