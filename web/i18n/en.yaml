    reauthCodeHint: "For your security, we sent a code to your email. Enter it to finish changing your password."
    signOutOthers: "Sign out everywhere else"
    # Revocation is not instant — Supabase's own docs are explicit that a
    # revoked session's access token stays valid until it expires. Never
    # imply the other devices are signed out the moment this button is
    # clicked (docs/profile-refactor-plan.md §14·B·10).
    signOutOthersHint: "Ends every session but this one. Other devices stay signed in until their current session expires."
    logoutScope: "Signing out ends your session on every device."
