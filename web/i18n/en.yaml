# SFDA Copilot — English catalogue
#
# Two subtrees, deliberately:
#   runtime:  exported to the browser as window.__I18N (JS-facing strings only)
#   page:     server-rendered via {{ t('page....') }}, never sent to JS
#
# IMPORTANT: several values below are asserted verbatim by the Playwright suite
# (web/tests/test_frontend.py, test_theme_toggle.py). Changing their wording is
# a test change, not just a copy change. They are marked "frozen".

runtime:
  chat:
    send: "Send"                                        # frozen
    cancel: "Cancel"
    sendAria: "Send message"                            # frozen
    cancelAria: "Cancel message"                         # frozen
    sendFailed: "Failed to send message."                # frozen
    # Distinct from sendFailed on purpose: the answer above this toast is
    # complete and correctly cited. What did not happen is the filing.
    notSaved: "This answer could not be saved to your history."
    cancelled: "Chat request cancelled."                 # frozen
    # Distinct from sessions.busy: this guards a second question (FAQ,
    # suggested chip) fired while one is already streaming, not a conversation
    # switch. Refusing silently there read as a dead button — see harden pass.
    busy: "Wait for the current answer to finish before asking another question."
    loginRequired: "Please log in to chat with the AI."  # frozen
    sessionUnverified: "Unable to verify your session. Please try again."  # frozen
    genericError: "Sorry, I encountered an error while processing your request. Please try again."  # frozen (prefix)
    invalidResponse: "Invalid response format from AI service."
    stopped: "Stopped"
    incomplete: "Answer incomplete — something went wrong"
    askPrefix: "Ask: {question}"
    jumpToLatest: "Jump to latest"
    jumpToLatestAria: "Scroll to the latest message"
    # "New chat" is a client-side navigation to `/` now (Decision 2 of
    # docs/per-tab-conversation-deep-linking-plan.md); Back is the undo, so
    # there is no undo action, no restored/resetFailed/restoreFailed string,
    # and no resumed-conversation disclosure to catalogue here any more.
    cleared: "Conversation cleared"
    # Distinct from an empty transcript on purpose. Rendering nothing would
    # claim the reader has no stored history; this says the history could not
    # be read, which is a different fact.
    historyUnavailable: "Your conversation history could not be loaded."
    # THE DURABLE-HISTORY DISCLOSURE. Shown once per reader per device.
    #
    # Before hydration shipped, the transcript died with the tab, so saying
    # nothing was defensible. It is not any more: a conversation now follows the
    # reader across a reload, a language toggle and a different device, and a
    # regulatory professional who signs out believing their questions are gone
    # is being misled by omission.
    #
    # THE DELETE SENTENCE ARRIVED IN STEP 8, and the history of it is the point.
    # Until the sidebar shipped, this string deliberately offered no way to
    # delete a conversation: the RLS grant existed but nothing called it, so an
    # earlier draft's "or delete a conversation to clear one" would have been
    # the product's newest false claim, and a test pinned it out.
    #
    # There is now a control that honours it — `DELETE /api/chat/sessions/<id>`,
    # reached from the row's own trash button — so the sentence is true and the
    # test that forbade it changed with the feature, deliberately, exactly as
    # TODO.md said it would.
    #
    # It says "from the sidebar" rather than "in Settings" because that is where
    # the control is, and a disclosure that sends the reader to the wrong place
    # is only marginally better than one that names no place at all.
    historyNotice: "Your chats are saved to your account. They restore on any device. Signing out does not delete them, and neither does starting a new chat — delete a conversation from the sidebar to remove it."
    # Not only PII. The realistic risk on this product is not a patient
    # identifier — it is a regulatory professional pasting an unpublished
    # dossier, submission correspondence, or a product plan into a free-text
    # box. The warning has to name that, or it reads as boilerplate about
    # somebody else's problem.
    historyNoticeWarning: "Do not enter patient identifiers, clinical-trial subject data, personal information, or confidential or proprietary material."
    historyNoticeDismiss: "Dismiss"

    # ── Notification Center (reader) ──────────────────────────────────────
    # docs/notification-center-plan.md. Nested under chat.* rather than a new
    # top-level runtime namespace — test_admin_page.py pins the top-level
    # runtime.* set to 11 names and notifications is not one of them.
    notifications:
      bellAria: "Notifications"
      unreadBadge: "{count} unread"
      inboxTitle: "Notifications"
      inboxEmpty: "No notifications yet."
      inboxUnavailable: "Notifications could not be loaded."
      loadMore: "Load more"
      markAllRead: "Mark all as read"
      markAllReadFailed: "Could not mark all notifications as read."
      markReadFailed: "Could not update that notification."
      dismiss: "Dismiss"
      # The modal's explicit action only — never implied by Escape or a
      # backdrop click, which snooze the modal for this browser session
      # without recording an acknowledgement.
      acknowledge: "Got it"
      loadFailed: "Notifications could not be loaded."
      bannerDismiss: "Dismiss"

  # ── The conversation sidebar (step 8) ───────────────────────────────────
  # Every string the list draws at runtime. The group headings are catalogue
  # entries rather than Intl.RelativeTimeFormat output, and that is a decision
  # rather than a shortcut: Arabic has six plural forms where `I18n.plural`
  # knows two, Intl emits bidi control characters that reorder inside an RTL
  # column, and the language toggle reloads the page — so a cached relative
  # string is stale by construction. Five fixed buckets are grammatical in both
  # scripts, need no plural rules, and say the same thing.
  sessions:
    tabChats: "Chats"
    tabFAQ: "FAQ"
    # The tablist's own name. Screen readers announce it before the tabs, so it
    # has to say what the two tabs choose BETWEEN, not repeat one of them.
    tabsAria: "Sidebar contents"
    listAria: "Your conversations"
    # Shown for a conversation whose title is null — a session written before
    # first-turn titling shipped, or one whose name the reader cleared.
    untitled: "Untitled conversation"
    today: "Today"
    yesterday: "Yesterday"
    previous7: "Previous 7 days"
    previous30: "Previous 30 days"
    older: "Older"
    loadMore: "Load more"
    loading: "Loading your conversations…"
    # Distinct from `unavailable` on purpose, and the distinction is the same
    # one `historyUnavailable` already draws for the transcript: this says the
    # reader has no saved conversations, which is a claim about them. Making it
    # while the store is unreachable would be a quiet untruth.
    empty: "No saved conversations yet."
    emptyHint: "Ask a question and it will appear here."
    unavailable: "Your conversations could not be loaded."
    retry: "Try again"
    # The row's own accessible name. The count travels because a title alone
    # cannot distinguish a conversation the reader abandoned after one question
    # from one they worked in all afternoon.
    openAria: "Open conversation: {title}"
    turns: "{count} messages"
    turnsOne: "{count} message"
    renameAria: "Rename: {title}"
    renameLabel: "Conversation name"
    renameSave: "Save name"
    renameCancel: "Cancel renaming"
    renamed: "Conversation renamed"
    renameFailed: "That conversation could not be renamed."
    deleteAria: "Delete: {title}"
    # An inline confirmation, not a modal. Deleting one row out of a list does
    # not need protected focus, and a dialog would take the reader out of the
    # column they are working in to answer a question about it.
    deleteConfirm: "Delete this conversation?"
    deleteConfirmYes: "Delete"
    deleteConfirmNo: "Keep"
    deleted: "Conversation deleted"
    deleteFailed: "That conversation could not be deleted."
    switchFailed: "That conversation could not be opened."
    # Shown when the reader reaches for a sidebar control while an answer is
    # still arriving. It names the two ways out, because a disabled control that
    # does not say what would re-enable it is indistinguishable from a broken
    # one.
    busy: "Wait for the answer to finish, or cancel it, before changing conversation."

  stage:
    searching: "Searching the guidelines"
    retrieved: "Found {count} passages"
    retrievedOne: "Found {count} passage"
    drafting: "Drafting the answer"
    finalizing: "Finishing up"

  robot:
    idle: "Ready to help"                                # frozen
    thinking: "Processing your question..."
    talking: "Here's what I found"
    happy: "Great question!"
    error: "Something went wrong"
    searching: "Searching the guidelines..."
    retrieved: "Reading the passages..."
    draftingStatus: "Drafting the answer..."
    finalizingStatus: "Finishing up..."
    foundPassages: "Found {count} passages"
    foundPassage: "Found {count} passage"
    farewell: "See you in the chat"

  auth:
    loggedInAs: "Logged in as: {email}"                  # frozen
    notLoggedIn: "Not logged in"
    invalidCredentials: "Incorrect email or password."   # frozen
    accountDisabled: "Chat access for this account has been turned off. Contact your administrator if you think this is a mistake."
    emailNotConfirmed: "Please confirm your email before logging in."
    alreadyRegistered: "This email is already registered. Please log in."
    invalidEmail: "Please provide a valid email address."
    checkingStatus: "Checking status..."
    servicesUnavailable: "Authentication services are not configured."
    initFailed: "Failed to initialize core application services."
    missingFields: "Please fill in both email and password."
    # Replaces a three-second toast that left a freshly-reset, empty form on
    # screen with no other signal. Names the address back so a typo is
    # visible while it can still be fixed cheaply.
    signupSent:
      heading: "Check your email"
      lead: "We sent a confirmation link to {email}. Open it to finish creating your account."
      spam: "No email after a few minutes? Check your spam folder."
    # Both of these map a GoTrue message that would otherwise reach the reader as
    # raw English. `emailUnavailable` also covers the signup rate limit, which is
    # the same ceiling surfacing on the adjacent form.
    tooSoon: "You just asked for a link. Wait a minute before asking again — check your inbox and your spam folder in the meantime."
    emailUnavailable: "We could not send the email just now. Nothing has changed on your account — please try again shortly."
    # Nested under auth rather than a top-level `recovery` block: the inlined
    # catalogue's top-level keys are a closed allow-list, and a new one there
    # fails test_page_strings_never_reach_the_browser.
    recovery:
      sent: "If that address has an account, a reset link is on its way."
      contactAdmin: "Still not there? Contact your administrator."
      mismatch: "The two passwords do not match."
      saving: "Saving your new password..."
      done: "Your password has been changed. Please sign in with it."
      expired: "This link has expired or has already been used. Request a new one to try again."
      failed: "We could not change your password. Please request a new link."
      resendIn: "You can ask again in {count}s"

  profile:
    loadFailed: "Failed to load your profile."
    saveFailed: "Failed to save your profile."
    saved: "Profile saved."
    sessionExpired: "Your session seems to have expired. Please log out and log in again."
    loginRequired: "Please log in to manage your profile."
    # /account's own runtime strings. Nested here rather than under a new
    # top-level `account` block: test_admin_page.py pins the inlined
    # runtime.* top-level keys to a closed set, and runtime_subset ships the
    # whole tree (minus `admin`) to every page — a new top-level block would
    # appear, unasked for, on the console too.
    account:
      roleAdmin: "Administrator"
      roleUser: "Reader"
      tierFree: "Free"
      tierInternal: "Internal"
      standingEnabled: "Active"
      standingDisabled: "Disabled"
      conversationOne: "{count} conversation"
      conversations: "{count} conversations"
      identitySaving: "Saving…"
      identitySaved: "Saved."
      identitySaveFailed: "Could not save. Please try again."
      preferencesSaved: "Saved."
      preferencesSaveFailed: "Could not save. Please try again."
      loadFailed: "Could not load your account. Please reload the page."
      passwordSaving: "Changing your password…"
      passwordSaved: "Your password has been changed."
      # GoTrue asked for a code before it would proceed — not a failure, the
      # form reveals the code field and waits.
      passwordReauthSent: "We sent a verification code to your email. Enter it below and try again."
      passwordErrorWeak: "That password does not meet the requirements above."
      passwordErrorSame: "That is your current password. Choose a different one."
      passwordErrorReauth: "That code was not right. Check your email for the latest one."
      passwordErrorSession: "Your session has expired. Please sign in again."
      passwordErrorGeneric: "Could not change your password. Please try again."
      signOutOthersSaving: "Signing out other sessions…"
      signOutOthersSaved: "Done. Other devices will be signed out as their sessions expire."
      signOutOthersFailed: "Could not sign out other sessions. Please try again."
      consentGranted: "Granted."
      consentNotGranted: "Not granted."
      consentSaved: "Saved."
      consentFailed: "Could not save. Please try again."
      exportPreparing: "Preparing your export…"
      exportStarted: "Your download has started."
      exportFailed: "Could not export your conversations. Please try again."
      deleteAllConfirm: "Delete all conversations? This cannot be undone."
      deleteAllSaving: "Deleting…"
      deleteAllSaved: "All your conversations have been deleted."
      deleteAllInFlight: "An answer is still being generated. Try again once it finishes."
      deleteAllFailed: "Could not delete your conversations. Please try again."
    # The first-run completion strip (docs/profile-refactor-plan.md §12.6).
    # Nested under `finish*` rather than a new `runtime.account` block, for
    # the same top-level-key reason as `account` above.
    finishPrompt: "Add your name so your account record is complete."
    finishOpen: "Open account"
    finishDismiss: "Dismiss"
    finishDismissAria: "Dismiss"

  faq:
    loadFailed: "Failed to load FAQs."
    loadFailedTesting: "Failed to load FAQs in testing mode."
    empty: "No FAQs available."
    # A category over the rail's four-per-group limit gets this instead of
    # dumping every question into the reader's first look; see UI.Faq.
    # One/many via I18n.plural, matching cite.sourcesOne/sourcesMany's pattern.
    showMoreOne: "Show 1 more"
    showMoreMany: "Show {count} more"

  theme:
    announced: "Theme changed to {mode} mode"            # frozen
    light: "light"
    dark: "dark"

  cite:
    marker: "Source {n}"
    sourcesOne: "{n} source"
    sourcesMany: "{n} sources"
    answerComplete: "Answer complete."
    # Counts the CITED passages. It used to be read out with the RETRIEVED
    # count, so it told a screen reader that a refusal had cited eight sources.
    answerCompleteWithSources: "Answer complete. {n} sources cited."
    # The trigger. "document" is a file, "passage" is a chunk of one — never
    # use them interchangeably, and never report a passage count as documents.
    sourcesLabel: "Sources"
    docsOne: "1 document"
    docsMany: "{n} documents"
    passagesOne: "1 passage"
    passagesMany: "{n} passages"
    # The panel.
    panelTitle: "Sources for this answer"
    page: "Page {n}"
    pageShort: "p.{n}"
    pageUnknown: "No page cited"
    tabAria: "Source {n}, page {page}"
    # Dated evidence. The passage behind a stored citation is exactly what the
    # model read, kept with the answer — so it still opens. What the reader is
    # told is that the corpus has moved since, because quoting a superseded
    # regulation to an auditor is the failure this product cannot afford, and
    # so is discarding a faithful record because it is old.
    datedBadge: "Earlier edition"
    datedNote: "The document set has been rebuilt since this answer. These are the passages it was written from — check the current documents before relying on them."
    tabAriaNoPage: "Source {n}, no page cited"
    closePassage: "Close passage"
    unknownDocument: "Unknown document"
    close: "Close sources"
    # Raw retrieval figures. Named as diagnostics, not confidence, because that
    # is what they are — no percentages, no bars.
    diagnostics: "Retrieval diagnostics"
    diagnosticsNote: "Ranking figures used to order these passages. They are not a measure of accuracy or of how well a passage supports the answer."
    combinedMatch: "Combined"
    semanticMatch: "Semantic"
    keywordMatch: "Keyword"

  lang:
    switchAria: "Switch language"
    toArabic: "التبديل إلى العربية"
    toEnglish: "Switch to English"

  # Console strings the browser draws. Kept apart from page.admin because only
  # the runtime slice is inlined as window.__I18N — and this block ships to
  # /admin alone, never to the anonymous landing page.
