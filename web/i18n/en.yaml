# SFDA Copilot — English catalogue
#
# Two subtrees, deliberately:
#   runtime:  exported to the browser as window.__I18N (JS-facing strings only)
#   page:     server-rendered via {{ t('page....') }}, never sent to JS
#
# IMPORTANT: several values below are asserted verbatim by the Playwright suite
# (web/tests/test_frontend.py, test_theme_toggle.py). Changing their wording is
# a test change, not just a copy change. They are marked "frozen".

runtime:
  chat:
    send: "Send"                                        # frozen
    cancel: "Cancel"
    sendAria: "Send message"                            # frozen
    cancelAria: "Cancel message"                         # frozen
    sendFailed: "Failed to send message."                # frozen
    # Distinct from sendFailed on purpose: the answer above this toast is
    # complete and correctly cited. What did not happen is the filing.
    notSaved: "This answer could not be saved to your history."
    cancelled: "Chat request cancelled."                 # frozen
    # Distinct from sessions.busy: this guards a second question (FAQ,
    # suggested chip) fired while one is already streaming, not a conversation
    # switch. Refusing silently there read as a dead button — see harden pass.
    busy: "Wait for the current answer to finish before asking another question."
    loginRequired: "Please log in to chat with the AI."  # frozen
    sessionUnverified: "Unable to verify your session. Please try again."  # frozen
    genericError: "Sorry, I encountered an error while processing your request. Please try again."  # frozen (prefix)
    invalidResponse: "Invalid response format from AI service."
    stopped: "Stopped"
    incomplete: "Answer incomplete — something went wrong"
    askPrefix: "Ask: {question}"
    jumpToLatest: "Jump to latest"
    jumpToLatestAria: "Scroll to the latest message"
    cleared: "Conversation cleared"
    undo: "Undo"
    restored: "Conversation restored"
    resetFailed: "Could not start a new chat. Your conversation is unchanged."
    # Deliberately NOT resetFailed: by the time an undo can fail, the reset has
    # already stood, so telling the reader their conversation is unchanged would
    # be the opposite of what happened.
    restoreFailed: "Could not restore the previous conversation."
    # Shown when the conversation on screen was picked up from the reader's
    # stored history rather than started in this browser — a new device, a
    # cleared browser, or the first visit after signing out. It is a
    # disclosure, not a warning: a conversation that reappears with no
    # explanation is the part of durable history that could read as the app
    # acting behind the reader's back.
    resumed: "Picked up from your history. Start a new chat to begin fresh."
    resumedDismiss: "Dismiss"
    # Distinct from an empty transcript on purpose. Rendering nothing would
    # claim the reader has no stored history; this says the history could not
    # be read, which is a different fact.
    historyUnavailable: "Your conversation history could not be loaded."
    # THE DURABLE-HISTORY DISCLOSURE. Shown once per reader per device.
    #
    # Before hydration shipped, the transcript died with the tab, so saying
    # nothing was defensible. It is not any more: a conversation now follows the
    # reader across a reload, a language toggle and a different device, and a
    # regulatory professional who signs out believing their questions are gone
    # is being misled by omission.
    #
    # THE DELETE SENTENCE ARRIVED IN STEP 8, and the history of it is the point.
    # Until the sidebar shipped, this string deliberately offered no way to
    # delete a conversation: the RLS grant existed but nothing called it, so an
    # earlier draft's "or delete a conversation to clear one" would have been
    # the product's newest false claim, and a test pinned it out.
    #
    # There is now a control that honours it — `DELETE /api/chat/sessions/<id>`,
    # reached from the row's own trash button — so the sentence is true and the
    # test that forbade it changed with the feature, deliberately, exactly as
    # TODO.md said it would.
    #
    # It says "from the sidebar" rather than "in Settings" because that is where
    # the control is, and a disclosure that sends the reader to the wrong place
    # is only marginally better than one that names no place at all.
    historyNotice: "Your chats are saved to your account. They restore on any device. Signing out does not delete them, and neither does starting a new chat — delete a conversation from the sidebar to remove it."
    # Not only PII. The realistic risk on this product is not a patient
    # identifier — it is a regulatory professional pasting an unpublished
    # dossier, submission correspondence, or a product plan into a free-text
    # box. The warning has to name that, or it reads as boilerplate about
    # somebody else's problem.
    historyNoticeWarning: "Do not enter patient identifiers, clinical-trial subject data, personal information, or confidential or proprietary material."
    historyNoticeDismiss: "Dismiss"

  # ── The conversation sidebar (step 8) ───────────────────────────────────
  # Every string the list draws at runtime. The group headings are catalogue
  # entries rather than Intl.RelativeTimeFormat output, and that is a decision
  # rather than a shortcut: Arabic has six plural forms where `I18n.plural`
  # knows two, Intl emits bidi control characters that reorder inside an RTL
  # column, and the language toggle reloads the page — so a cached relative
  # string is stale by construction. Five fixed buckets are grammatical in both
  # scripts, need no plural rules, and say the same thing.
  sessions:
    tabChats: "Chats"
    tabFAQ: "FAQ"
    # The tablist's own name. Screen readers announce it before the tabs, so it
    # has to say what the two tabs choose BETWEEN, not repeat one of them.
    tabsAria: "Sidebar contents"
    listAria: "Your conversations"
    # Shown for a conversation whose title is null — a session written before
    # first-turn titling shipped, or one whose name the reader cleared.
    untitled: "Untitled conversation"
    today: "Today"
    yesterday: "Yesterday"
    previous7: "Previous 7 days"
    previous30: "Previous 30 days"
    older: "Older"
    loadMore: "Load more"
    loading: "Loading your conversations…"
    # Distinct from `unavailable` on purpose, and the distinction is the same
    # one `historyUnavailable` already draws for the transcript: this says the
    # reader has no saved conversations, which is a claim about them. Making it
    # while the store is unreachable would be a quiet untruth.
    empty: "No saved conversations yet."
    emptyHint: "Ask a question and it will appear here."
    unavailable: "Your conversations could not be loaded."
    retry: "Try again"
    # The row's own accessible name. The count travels because a title alone
    # cannot distinguish a conversation the reader abandoned after one question
    # from one they worked in all afternoon.
    openAria: "Open conversation: {title}"
    turns: "{count} messages"
    turnsOne: "{count} message"
    renameAria: "Rename: {title}"
    renameLabel: "Conversation name"
    renameSave: "Save name"
    renameCancel: "Cancel renaming"
    renamed: "Conversation renamed"
    renameFailed: "That conversation could not be renamed."
    deleteAria: "Delete: {title}"
    # An inline confirmation, not a modal. Deleting one row out of a list does
    # not need protected focus, and a dialog would take the reader out of the
    # column they are working in to answer a question about it.
    deleteConfirm: "Delete this conversation?"
    deleteConfirmYes: "Delete"
    deleteConfirmNo: "Keep"
    deleted: "Conversation deleted"
    deleteFailed: "That conversation could not be deleted."
    switchFailed: "That conversation could not be opened."
    # Shown when the reader reaches for a sidebar control while an answer is
    # still arriving. It names the two ways out, because a disabled control that
    # does not say what would re-enable it is indistinguishable from a broken
    # one.
    busy: "Wait for the answer to finish, or cancel it, before changing conversation."

  stage:
    searching: "Searching the guidelines"
    retrieved: "Found {count} passages"
    retrievedOne: "Found {count} passage"
    drafting: "Drafting the answer"
    finalizing: "Finishing up"

  robot:
    idle: "Ready to help"                                # frozen
    thinking: "Processing your question..."
    talking: "Here's what I found"
    happy: "Great question!"
    error: "Something went wrong"
    searching: "Searching the guidelines..."
    retrieved: "Reading the passages..."
    draftingStatus: "Drafting the answer..."
    finalizingStatus: "Finishing up..."
    foundPassages: "Found {count} passages"
    foundPassage: "Found {count} passage"
    farewell: "See you in the chat"

  auth:
    loggedInAs: "Logged in as: {email}"                  # frozen
    notLoggedIn: "Not logged in"
    invalidCredentials: "Incorrect email or password."   # frozen
    accountDisabled: "Chat access for this account has been turned off. Contact your administrator if you think this is a mistake."
    emailNotConfirmed: "Please confirm your email before logging in."
    alreadyRegistered: "This email is already registered. Please log in."
    invalidEmail: "Please provide a valid email address."
    checkingStatus: "Checking status..."
    servicesUnavailable: "Authentication services are not configured."
    initFailed: "Failed to initialize core application services."
    # Both of these map a GoTrue message that would otherwise reach the reader as
    # raw English. `emailUnavailable` also covers the signup rate limit, which is
    # the same ceiling surfacing on the adjacent form.
    tooSoon: "You just asked for a link. Wait a minute before asking again — check your inbox and your spam folder in the meantime."
    emailUnavailable: "We could not send the email just now. Nothing has changed on your account — please try again shortly."
    # Nested under auth rather than a top-level `recovery` block: the inlined
    # catalogue's top-level keys are a closed allow-list, and a new one there
    # fails test_page_strings_never_reach_the_browser.
    recovery:
      sent: "If that address has an account, a reset link is on its way."
      contactAdmin: "Still not there? Contact your administrator."
      mismatch: "The two passwords do not match."
      saving: "Saving your new password..."
      done: "Your password has been changed. Please sign in with it."
      expired: "This link has expired or has already been used. Request a new one to try again."
      failed: "We could not change your password. Please request a new link."
      resendIn: "You can ask again in {count}s"

  profile:
    loadFailed: "Failed to load your profile."
    saveFailed: "Failed to save your profile."
    saved: "Profile saved."
    sessionExpired: "Your session seems to have expired. Please log out and log in again."
    loginRequired: "Please log in to manage your profile."

  faq:
    loadFailed: "Failed to load FAQs."
    loadFailedTesting: "Failed to load FAQs in testing mode."
    empty: "No FAQs available."
    # A category over the rail's four-per-group limit gets this instead of
    # dumping every question into the reader's first look; see UI.Faq.
    # One/many via I18n.plural, matching cite.sourcesOne/sourcesMany's pattern.
    showMoreOne: "Show 1 more"
    showMoreMany: "Show {count} more"

  theme:
    announced: "Theme changed to {mode} mode"            # frozen
    light: "light"
    dark: "dark"

  cite:
    marker: "Source {n}"
    sourcesOne: "{n} source"
    sourcesMany: "{n} sources"
    answerComplete: "Answer complete."
    # Counts the CITED passages. It used to be read out with the RETRIEVED
    # count, so it told a screen reader that a refusal had cited eight sources.
    answerCompleteWithSources: "Answer complete. {n} sources cited."
    # The trigger. "document" is a file, "passage" is a chunk of one — never
    # use them interchangeably, and never report a passage count as documents.
    sourcesLabel: "Sources"
    docsOne: "1 document"
    docsMany: "{n} documents"
    passagesOne: "1 passage"
    passagesMany: "{n} passages"
    # The panel.
    panelTitle: "Sources for this answer"
    page: "Page {n}"
    pageShort: "p.{n}"
    pageUnknown: "No page cited"
    tabAria: "Source {n}, page {page}"
    # Dated evidence. The passage behind a stored citation is exactly what the
    # model read, kept with the answer — so it still opens. What the reader is
    # told is that the corpus has moved since, because quoting a superseded
    # regulation to an auditor is the failure this product cannot afford, and
    # so is discarding a faithful record because it is old.
    datedBadge: "Earlier edition"
    datedNote: "The document set has been rebuilt since this answer. These are the passages it was written from — check the current documents before relying on them."
    tabAriaNoPage: "Source {n}, no page cited"
    closePassage: "Close passage"
    unknownDocument: "Unknown document"
    close: "Close sources"
    # Raw retrieval figures. Named as diagnostics, not confidence, because that
    # is what they are — no percentages, no bars.
    diagnostics: "Retrieval diagnostics"
    diagnosticsNote: "Ranking figures used to order these passages. They are not a measure of accuracy or of how well a passage supports the answer."
    combinedMatch: "Combined"
    semanticMatch: "Semantic"
    keywordMatch: "Keyword"

  lang:
    switchAria: "Switch language"
    toArabic: "التبديل إلى العربية"
    toEnglish: "Switch to English"

  # Console strings the browser draws. Kept apart from page.admin because only
  # the runtime slice is inlined as window.__I18N — and this block ships to
  # /admin alone, never to the anonymous landing page.
  admin:
    accessDenied: "This console is for administrators."
    accessCheckFailed: "Could not confirm your access. Reload to try again."
    # Distinct from signedOut. The server could not reach the sign-in service,
    # which says nothing about this administrator's credentials — and sending
    # them to sign in again would be sending them to fix something that works.
    identityUnavailable: "The sign-in service could not be reached, so your access could not be checked. Your session is still valid — try again in a moment."
    signedOut: "You are not signed in. Sign in on the chat page first."
    signedInAs: "Signed in as {email}"
    roleLabel: "Role"
    empty: "Nothing here yet."
    settings:
      heading: "Generation"
      hint: "Applies to answers from here on. Conversations already streaming finish on the previous settings."
      model: "Model"
      temperature: "Temperature"
      maxTokens: "Maximum answer length"
      maxContextResults: "Passages per answer"
      reasoningEffort: "Reasoning effort"
      reasoningNotSupported: "This model does not use reasoning."
      reasoningDefault: "Model default"
      save: "Save changes"
      saving: "Saving…"
      saved: "Settings saved."
      savedNotApplied: "Saved, but not applied to answers yet. The previous settings are still live."
      # The model name is a machine fact and is not translated; see config.yaml.
      notLive: "Answers are currently coming from {model}, not from the model selected here. Save to apply, or restart the server."
      usingDefault: "Deployed default"
      overridden: "Changed here"
      revert: "Revert to default"
      loadFailed: "Could not load settings."
      saveFailed: "Could not save settings."
    errors:
      not_allowed: "Not one of the available choices."
      above_ceiling: "Too large. The most this allows is {limit}."
      out_of_range: "Must be between {limit}."
      not_a_number: "Must be a number."
      not_a_positive_integer: "Must be a whole number above zero."
      unknown_setting: "Not a setting this console recognises."
      reasoning_not_supported: "The selected model does not accept a reasoning effort."
      storage_unavailable: "Settings storage is unavailable, so nothing was saved."
    audit:
      heading: "Activity"
      hint: "Every change made here, newest first. Records cannot be edited or removed."
      empty: "No changes recorded yet."
      loadFailed: "Could not load the activity log."
      columnWhen: "When"
      columnWho: "Who"
      columnWhat: "What"
      columnChange: "Change"
      columnReason: "Reason"
      more: "Load more"
      actionSettingsUpdate: "Changed settings"
      actionUserDisable: "Disabled chat access"
      actionUserEnable: "Restored chat access"
      actionUserRoleChange: "Changed a role"
      actionUserProfileChange: "Edited a profile"
      # "requested" then "accepted", never "sent": the code observes that GoTrue
      # took the request, not that anything was delivered.
      actionResetRequested: "Started a password reset"
      actionResetAccepted: "Password reset accepted for sending"
      actionResetFailed: "Password reset could not be sent"
      actionSessionsRevokeRequested: "Started ending sessions"
      actionSessionsRevokeAccepted: "Sessions ended"
      actionSessionsRevokeFailed: "Could not end sessions"
      actionSessionsRevokeUnknown: "Ending sessions — outcome unknown"
      actionEmailChangeRequested: "Started an email change"
      actionEmailChangeAccepted: "Email address changed"
      actionEmailChangeFailed: "Email change failed"
      actionEmailChangeUnknown: "Email change — outcome unknown"
    account:
      back: "Back to all users"
      identityHeading: "Identity"
      profileHeading: "Profile"
      activityHeading: "Activity on this account"
      created: "Created"
      lastSignIn: "Last signed in"
      lastSeen: "Last active"
      disabledAt: "Disabled at"
      confirmed: "Email confirmed"
      notConfirmed: "Not confirmed"
      # `email_confirmed_at` above is when the account was FIRST confirmed and
      # is never cleared by an admin email change — this reads the current
      # email identity's own flag, so it cannot show a stale "confirmed" next
      # to an address nobody verified.
      currentEmailVerified: "Current address verified"
      emailVerifiedYes: "Yes"
      emailNotVerified: "No — not independently verified"
      emailVerifiedUnknown: "Unknown"
      standing: "Standing"
      disabledBy: "Disabled by"
      disabledReason: "Reason"
      fullName: "Full name"
      organization: "Organization"
      specialization: "Specialization"
      notSet: "Not set"
      noActivity: "Nothing has been done to this account yet."
      loadFailed: "Could not load this account."
      activityFailed: "Could not load this account's activity."
      actionsHeading: "Account actions"
      sendReset: "Send password reset"
      confirmReset: "Send a password reset link to {email}?"
      resetAccepted: "Reset link accepted for sending."
      resetFailed: "The reset link could not be sent."
      reset_rate_limited: "A link was requested for this account less than a minute ago."
      reset_quota_exhausted: "This project's email allowance is used up for now. Nothing was sent."
      reset_no_email: "This account has no email address to send to."
      # Stated on the surface, not just in a commit message. The support outcome
      # people want from "set their password" is "get them back in", and a link
      # delivers that without anyone learning a secret.
      noPasswordHint: "An operator can send a reset link. Nobody here can set or see a password."
      # What is deliberately absent, said out loud — an operator mid-incident
      # should not have to work out that the console cannot do something yet.
      # Empty today: this list is conditionally hidden when it has nothing in it.
      absentHeading: "Not available here yet"
      revokeSessions: "End all sessions"
      # States the residual-JWT caveat plainly, in the confirm copy itself —
      # this is the mechanism GoTrue's Admin API actually offers (a password
      # rotation the operator never sees), not a made-up "sign out" button.
      confirmRevoke: "End every session for {email}? This resets their password to a value nobody will see, which forces sign-in everywhere. It does not end a request already in flight — an access token already issued stays valid until it expires on its own."
      revokeAccepted: "Sessions ended. New sign-ins will need a new password reset."
      revokeFailed: "Could not end this account's sessions."
      changeEmail: "Change email address"
      emailPrompt: "New email address for {email}:"
      # States the immediate/unverified caveat plainly: there is no reader-side
      # confirmation step on this path, unlike a reader changing their own email.
      confirmEmailChange: "Change {email} to {newEmail}? This takes effect immediately — there is no confirmation step, and the new address is not verified as reachable."
      emailChangeAccepted: "Email address changed."
      emailChangeFailed: "Could not change this account's email address."
      email_already_registered: "Another account already uses that email address."
      same_email: "That is already this account's email address."
      invalid_email: "That does not look like an email address."
      too_long: "That email address is too long."
      cannot_change_own_email: "An administrator cannot change their own email address here."
      actor_no_longer_administrator: "Your administrator access changed during this request. Sign in again."
      auth_admin_unavailable: "Session and email changes are not configured on this deployment."
      auth_admin_unreachable: "Could not reach the authentication provider. Nothing changed."
      auth_admin_failed: "The authentication provider refused this change."
      no_such_account: "This account no longer exists."
      saveProfile: "Save profile"
      # Says who sees it and that the change is kept. An operator rewriting
      # somebody else's description of themselves should know both.
      profileHint: "This is what the person sees on their own profile. Every change is recorded with what it said before."
      profileSaved: "Profile saved."
      profileSaveFailed: "Could not save this profile."
      profile_changed_since_loaded: "Somebody else changed this profile while you were editing. Reload before saving."
      profile_too_long: "One of these is too long. Each field holds up to 200 characters."
      brokenHeading: "This account has no profile"
      # The same fact as brokenHeading, at pill length. The heading explains; a
      # mark beside the address only has room to name the state.
      noProfileMark: "No profile"
      brokenBody: "It exists in authentication but has no profile row, so its role and access cannot be read or changed. It was most likely created before the signup trigger was repaired."
    people:
      hint: "Accounts on this instance. Disabling chat access stops new questions; a conversation already streaming finishes, and the person can still sign in."
      empty: "No accounts found."
      loadFailed: "Could not load accounts."
      search: "Search by email"
      columnEmail: "Email"
      columnRole: "Role"
      columnAccess: "Chat access"
      columnLastSeen: "Last signed in"
      columnActions: ""
      roleAdmin: "Administrator"
      roleUser: "User"
      accessAllowed: "Allowed"
      accessDisabled: "Disabled"
      you: "you"
      never: "Never"
      promote: "Make administrator"
      demote: "Remove administrator"
      disable: "Disable chat access"
      enable: "Restore chat access"
      reasonPrompt: "Why is chat access being disabled? This is recorded."
      confirmDisable: "Disable chat access for {email}?"
      confirmDemote: "Remove administrator access from {email}?"
      changed: "Account updated."
      changeFailed: "Could not update the account."
      cannot_change_own_access: "You cannot change your own role or access."
      would_leave_no_administrator: "That would leave no administrator. Promote someone else first."
      no_such_account: "That account no longer exists."
      actor_no_longer_administrator: "Your administrator access changed while you were working. Reload and try again."
      reason_required: "A reason is required to disable chat access."
      pagerLabel: "People pages"
      previousPage: "Previous page"
      nextPage: "Next page"
      showing: "Showing"
      of: "of"
      pageSize: "Rows per page"
page:
  meta:
    title: "SFDA Copilot"
    description: "SFDA Copilot - AI-powered regulatory guidance for pharmaceutical regulations in Saudi Arabia"

  brand:
    name: "SFDA Copilot"
    # The wordmark's counterpart in the other script. The hero sets the two
    # together, because full EN/AR parity is a binding brand commitment and
    # the mark should state it rather than the copy claiming it.
    nameOther: "مساعد الغذاء والدواء الذكي"
    tagline: "Your AI Regulatory Assistant"

  landing:
    greeting: "Ready when you are"
    lead: "Ask a question instead of searching the guidelines — and see exactly which official SFDA document each answer came from."
    cta: "Get Started"
    hubLink: "AI Fouda Hub Website"
    linkedinLink: "Mohamed Fouda's LinkedIn"
    # PRODUCT.md, Principle 2: the name contains "SFDA", so every surface
    # carries the burden of saying this is not the SFDA. Not optional copy.
    notice: "<strong>SFDA Copilot is an independent tool.</strong> It is not affiliated with, endorsed by, or operated by the Saudi Food and Drug Authority. It reads the SFDA's published guidelines and shows you where each answer comes from, so you can verify it against the official source."
    version: "Version {v}"
    builtBy: "Built by Mohamed Fouda"

  features:
    heading: "What it does"
    coverage:
      title: "The Guideline Corpus"
      # No guideline count, deliberately: the corpus changes on every ingest and
      # any hard number goes stale in place. See PRODUCT.md, Evidence on Hand.
      body: "Regulatory, pharmacovigilance, veterinary medicines and biological products — the official SFDA guidelines, indexed and searchable in one place."
      badge: "Guidelines current through August 2026"
    authoritative:
      title: "Sourced to the Page"
      body: "Every answer carries numbered citations that resolve to the source guideline and its page, so you can check the original before you rely on it."
    streamlined:
      title: "Straight to the Requirement"
      body: "Find the registration procedures and requirements you need without reading the guidelines end to end."
    accuracy:
      title: "Arabic and English"
      body: "Ask in either language and the answer comes back in that language, from the same corpus. Arabic is not a translation layer."
    search:
      title: "Ask in Plain Language"
      body: "Put the question the way you would ask a colleague, and scope it to regulatory, pharmacovigilance, veterinary or biological products."

  nav:
    menu: "Menu"
    toggleNav: "Toggle navigation"
    toggleTheme: "Toggle theme"
    toggleThemeLong: "Toggle theme between light and dark"
    close: "Close"
    assistantStatus: "Assistant status"
    utilityAria: "Language and theme"
    mobileNavAria: "Mobile navigation"
    sidebarAria: "Sidebar"

  # Server-rendered halves of the conversation sidebar. The tab LABELS live here
