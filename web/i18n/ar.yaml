  # NOTE for review: Arabic has a dual form for exactly two, which the binary
  # I18n.plural helper (one / many) cannot express — "مصدران" is correct for 2
  # and these strings will say "2 مصادر" instead. The existing entries already
  # accept that; flagging it here because this block grew. Two passages from
  # two documents is a common shape for a cited answer, so the trigger hits the
  # dual case often. All strings below want a native pass.
  cite:
    marker: "المصدر {n}"
    sourcesOne: "مصدر واحد"
    sourcesMany: "{n} مصادر"
    answerComplete: "اكتملت الإجابة."
    answerCompleteWithSources: "اكتملت الإجابة. تم الاستشهاد بـ {n} مصادر."
