  # مسودة — انظر التعليق في en.yaml لسياق نفس القسم.
  policy:
    title: "سياسة الخصوصية · مساعد الغذاء والدواء الذكي"
    skipToContent: "الانتقال إلى السياسة"
    pageTitle: "سياسة الاستخدام والخصوصية"
    version: "الإصدار"
    draftHeading: "مسودة — قيد المراجعة"
    draftNotice: "هذه السياسة مسودة أولى، كُتبت لوصف المنتج بصدق ريثما تُراجَع النسخة النهائية. لم تُعتمد بعد كنص قانوني ملزم للمنتج. إن بدا أي شيء هنا غير متسق مع سلوك المنتج الفعلي، فذلك خلل في هذه المسودة، لا في المنتج."
    scopeHeading: "ما تغطيه هذه السياسة"
    scopeBody: "تصف هذه السياسة ما يجمعه مساعد الغذاء والدواء الذكي عنك، ولماذا، وما التحكم المتاح لك فيه. تغطي حسابك وملفك الشخصي والأسئلة التي تطرحها — لا الوثائق التنظيمية نفسها، فهي مصدر عام."
    collectHeading: "ما الذي نجمعه"
    collectIntro: "حسب طريقة استخدامك للمنتج، نجمع:"
    collectAccount: "بريدك الإلكتروني وكلمة مرورك، لتسجيل دخولك. لا تُخزَّن كلمة مرورك أبدًا بصيغة يمكننا قراءتها — يخزّن مزوّد المصادقة GoTrue بصمة مُملَّحة لها فقط."
    collectProfile: "تفاصيل الملف الشخصي التي تختار إضافتها — الاسم الأول واسم العائلة والجهة والتخصص — وعمرك فقط إن وافقت على ذلك بشكل منفصل."
    collectQuestions: "الأسئلة التي تطرحها والإجابات التي تتلقاها، تُخزَّن لتتمكن من العودة إلى محادثة لاحقًا. لا تُدخل في مربع المحادثة معرّفات مرضى أو بيانات مشاركين في تجارب سريرية أو أي مواد سرية أخرى — انظر التنويه الظاهر داخل التطبيق نفسه."
    collectTechnical: "بيانات تقنية اعتيادية تجمعها أي خدمة ويب — سجلات الطلبات وتقارير الأخطاء — تُستخدم فقط لإبقاء المنتج يعمل وآمنًا."
    useHeading: "كيف نستخدمها"
    useIntro: "نستخدم ما نجمعه من أجل:"
    useOperate: "تشغيل المنتج: مصادقتك، والإجابة عن أسئلتك، وعرض سجل محادثاتك الخاص بك."
    useImprove: "فهم المنتج وتحسينه بشكل إجمالي — لا لعزل نشاط شخص بعينه لغرض لم توافق عليه."
    useMarketing: "التواصل معك بخصوص المنتج أو إخبارك كيف تساعدنا معلوماتك على فهم مستخدميه — فقط إن وافقت على ذلك بشكل منفصل."
    useMarketingConsent: "يتطلب الاستخدام التسويقي لمعلومات ملفك الشخصي وعمرك تحديدًا موافقة صريحة ومنفصلة منك — مربع اختيار غير مُعلَّم عند إنشاء الحساب أو في صفحة حسابك. رفضه لا يؤثر في قدرتك على استخدام المنتج."
    shareHeading: "المشاركة"
    shareBody: "لا نبيع بياناتك الشخصية. نستخدم مزوّدي بنية تحتية (Supabase للمصادقة والتخزين، ومزوّد نموذج ذكاء اصطناعي لتوليد الإجابات) يعالجون البيانات نيابةً عنا، بموجب التزاماتهم الأمنية الخاصة، ولا لأغراضهم الخاصة أبدًا."
    retentionHeading: "مدة الاحتفاظ بالبيانات"
    retentionBody: "يُحتفَظ بحسابك ومحادثاتك طوال بقاء حسابك قائمًا. يمكنك حذف محادثات فردية أو جميعها في أي وقت من صفحة حسابك؛ حذف الحساب بالكامل ليس ذاتي الخدمة بعد — تواصل معنا إن احتجت ذلك."
    rightsHeading: "حقوقك"
    rightsIntro: "من صفحة حسابك، يمكنك:"
    rightsAccess: "الاطلاع على معلومات ملفك الشخصي وتصحيحها في أي وقت."
    rightsExport: "تنزيل نسخة كاملة من سجل محادثاتك كملف."
    rightsDelete: "حذف محادثات فردية، أو جميعها دفعة واحدة."
    rightsWithdraw: "سحب الموافقة على التسويق بسهولة منحها — دون أي حد لعدد المحاولات، ودون أن يُطلب منك تبرير ذلك."
    securityHeading: "الأمان"
    securityBody: "نستخدم التشفير أثناء النقل، وكلمات مرور مُجزَّأة، وضوابط وصول قائمة على الأدوار تحدّ من يرى ماذا داخل المؤسسة. لا يوجد نظام آمن تمامًا؛ إن شككت في اختراق حسابك، غيّر كلمة مرورك وسجّل الخروج من كل جلسة أخرى من صفحة حسابك."
    contactHeading: "التواصل"
    contactBody: "يمكن إرسال الأسئلة حول هذه السياسة، أو طلب لممارسة حق لم يُتَح بعد ذاتيًا، عبر قناة الدعم المعتادة للمنتج."

