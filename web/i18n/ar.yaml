# SFDA Copilot — Arabic (Modern Standard) catalogue
#
# Mirrors the key structure of en.yaml. Any key missing here falls back to the
# English value (see web/utils/i18n.py), so a partial translation degrades to
# mixed language rather than to a blank interface.
#
# Terminology follows SFDA regulatory usage: الهيئة العامة للغذاء والدواء,
# التيقظ الدوائي (pharmacovigilance), التسجيل (registration).

