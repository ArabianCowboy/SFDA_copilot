  # NOTE for review: Arabic has a dual form for exactly two, which the binary
  # I18n.plural helper (one / many) cannot express — "مصدران" is correct for 2
  # and these strings will say "2 مصادر" instead. The existing entries already
  # accept that; flagging it here because this block grew. Two passages from
  # two documents is a common shape for a cited answer, so the trigger hits the
  # dual case often. All strings below want a native pass.
  cite:
    marker: "المصدر {n}"
    sourcesOne: "مصدر واحد"
    sourcesMany: "{n} مصادر"
    answerComplete: "اكتملت الإجابة."
    answerCompleteWithSources: "اكتملت الإجابة. تم الاستشهاد بـ {n} مصادر."
    sourcesLabel: "المصادر"
    docsOne: "مستند واحد"
    docsMany: "{n} مستندات"
    passagesOne: "مقطع واحد"
    passagesMany: "{n} مقاطع"
    panelTitle: "مصادر هذه الإجابة"
    page: "صفحة {n}"
    pageShort: "ص.{n}"
    pageUnknown: "لم تُذكر الصفحة"
    tabAria: "المصدر {n}، صفحة {page}"
    tabAriaNoPage: "المصدر {n}، دون ذكر الصفحة"
    closePassage: "إغلاق المقطع"
    unknownDocument: "مستند غير معروف"
    close: "إغلاق المصادر"
    diagnostics: "تشخيصات الاسترجاع"
    diagnosticsNote: "أرقام الترتيب المستخدمة لترتيب هذه المقاطع. وهي ليست مقياسًا للدقة ولا لمدى دعم المقطع للإجابة."
    combinedMatch: "المجموع"
    semanticMatch: "دلالي"
    keywordMatch: "لفظي"

  lang:
    switchAria: "تغيير اللغة"
    toArabic: "التبديل إلى العربية"
    toEnglish: "Switch to English"

  # نصوص وحدة التحكم التي يرسمها المتصفح. منفصلة عن page.admin لأن شريحة
  # runtime وحدها تُضمَّن في window.__I18N — وهذه الكتلة تُشحن إلى /admin فقط.
  admin:
