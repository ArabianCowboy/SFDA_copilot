page:
  meta:
    title: "مساعد الهيئة العامة للغذاء والدواء"
    description: "مساعد ذكي للإرشادات التنظيمية الدوائية الصادرة عن الهيئة العامة للغذاء والدواء في المملكة العربية السعودية"

  brand:
    name: "مساعد الغذاء والدواء الذكي"
    # الاسم بالنص المقابل. يعرض القسم الرئيسي الاسمين معاً لأن التكافؤ الكامل
    # بين العربية والإنجليزية التزام ثابت للعلامة، فالأولى أن تُظهره العلامة
    # لا أن يدّعيه النص.
    nameOther: "SFDA Copilot"
    tagline: "مساعدك التنظيمي الذكي"

  landing:
    greeting: "جاهز متى شئت"
    lead: "بسّط الامتثال التنظيمي مع مساعدك المدعوم بالذكاء الاصطناعي للأنظمة الدوائية في المملكة العربية السعودية"
    heroAlt: "إرشادات تنظيمية بالذكاء الاصطناعي"
    cta: "ابدأ الآن"
    hubLink: "موقع AI Fouda Hub"
    linkedinLink: "حساب محمد فودة على LinkedIn"
    # PRODUCT.md، المبدأ الثاني: الاسم يحتوي على "الغذاء والدواء"، لذا يقع على
    # كل سطح عبء التصريح بأن هذا ليس الهيئة. هذا نص إلزامي لا اختياري.
    notice: "<strong>مساعد الغذاء والدواء أداة مستقلة.</strong> ليست تابعة للهيئة العامة للغذاء والدواء ولا معتمدة منها ولا مُشغَّلة من قِبلها. تقرأ الأدلة الإرشادية المنشورة للهيئة وتوضّح مصدر كل إجابة، لتتمكن من التحقق منها في المصدر الرسمي."
    version: "الإصدار {v}"
    builtBy: "من تطوير محمد فودة"

  features:
    heading: "ماذا يفعل"
    coverage:
      title: "مدونة الأدلة الإرشادية"
      # لا يُذكر عدد الأدلة عمداً: المحتوى يتغيّر مع كل تحديث وأي رقم ثابت يصبح قديماً.
      # راجع PRODUCT.md، قسم Evidence on Hand.
      body: "المجالات التنظيمية والتيقظ الدوائي والأدوية البيطرية والمنتجات الحيوية — الأدلة الرسمية للهيئة، مفهرسة وقابلة للبحث في مكان واحد."
      badge: "الأدلة محدّثة حتى أغسطس 2026"
    authoritative:
      title: "موثّق حتى الصفحة"
      body: "تحمل كل إجابة استشهادات مرقّمة تصل إلى الدليل الإرشادي وصفحته، لتتمكن من مراجعة المصدر قبل الاعتماد عليه."
    streamlined:
      title: "مباشرة إلى المتطلب"
      body: "اعثر على إجراءات ومتطلبات التسجيل التي تحتاجها دون قراءة الأدلة من أولها إلى آخرها."
    accuracy:
      title: "بالعربية والإنجليزية"
      body: "اسأل بأي من اللغتين وتأتيك الإجابة بها، من المدونة نفسها. العربية ليست طبقة ترجمة."
    search:
      title: "اسأل بلغتك الطبيعية"
      body: "اطرح السؤال كما تطرحه على زميل، وحدّد نطاقه في المجال التنظيمي أو التيقظ الدوائي أو الأدوية البيطرية أو المنتجات الحيوية."

