# ============================================
# SFDA Copilot - Application Configuration
# ============================================
# This is the SINGLE SOURCE OF TRUTH for application behavior.
# Secrets (API keys, database URLs) should be in .env file.
# ============================================

# --- Server Configuration ---
server:
  host: 0.0.0.0
  port: 5001
  debug: false  # Set to true for local development
  chat_history_length: 10  # Message pairs to keep in session
  
  # Rate limiting
  rate_limit:
    per_day: 200
    per_hour: 50
    per_minute: 10
    chat_api: "15 per minute"
    # Password recovery. Low on purpose: the endpoint is unauthenticated and
    # every accepted call sends mail, and GoTrue's own project-wide ceiling is
    # 30/hour — a caller must not be able to exhaust that in one minute.
    recover_api: "5 per minute"
  
  # CORS origins (only used when debug=false)
  allowed_origins:
    - https://sfda-copilot.aifoudahub.com

# --- Search Engine Configuration ---
search_engine:
  embedding_type: local  # 'openai' or 'local'
  embedding_model: all-mpnet-base-v2  # Model name for both local (SentenceTransformer) and OpenAI embeddings
  embedding_dimension: 768  # Used by the OpenAI client only; the local client derives its dimension from the loaded model
  
  # Search parameters
  k: 8  # Number of results to return
  semantic_weight: 0.5  # Weight for semantic search (0-1)
  lexical_weight: 0.5   # Weight for lexical search (0-1)
  semantic_multiplier: 10  # Candidate multiplier for semantic search
  lexical_multiplier: 10   # Candidate multiplier for lexical search

  # --- Relevance floor ---
  # A result must clear BOTH gates to reach the prompt or the source payload.
  # Without them, retrieval always returns k passages: an out-of-domain query
  # gets the least-bad eight rather than nothing.
  #
  # Units: semantic_score is exactly cosine similarity (query and chunk vectors
  # are both L2-normalised, so 1 - dist/2 reduces to cos) and lexical_score is
  # TF-IDF cosine, so `score` is a 50/50 blend of two cosines in [0,1]. That is
  # what makes an absolute cutoff meaningful at all.
  #
  # Both ship at 0.00 (disabled — behaviour identical to no floor). The source
  # panel's citation contract is what suppresses sources on an ungrounded
  # answer; this is a retrieval-quality improvement on top of it.
  #
  # DO NOT raise these without a held-out eval run: too high and in-domain
  # questions become false refusals, and the floor assumes AR→EN translation is
  # live (without OPENAI_API_KEY, Arabic queries embed untranslated and score
  # low across the board). See scripts/eval_retrieval.py.
  min_score: 0.00
  min_score_ratio: 0.00  # relative to the top hit; 0.0 disables

# --- OpenAI Configuration ---
openai:
  model: gpt-4o-mini
  temperature: 0.1
  max_tokens: 16384  # Max supported by gpt-4o-mini
  max_context_results: 8

  # Models an administrator may select at runtime. The console renders exactly
  # this list, and the server rejects anything absent from it.
  #
  # The split is the design: ADDING a model is a deploy decision, because it
  # changes what this application can be pointed at and needs someone to have
  # checked the ceiling below. CHOOSING among them is an operations decision,
  # made in the console by whoever is awake when a model degrades. An operator
  # who could type an arbitrary string could point production at a model that
  # does not exist, or at one whose output limit differs — and `max_tokens` is
  # not a free parameter: exceeding a model's ceiling is a 400 from the API on
  # every request, not a graceful degradation.
  #
  # `max_output_tokens` is enforced here rather than discovered at runtime,
  # because discovering it means finding out in production. VERIFY IT AGAINST
  # THE PROVIDER'S CURRENT DOCUMENTATION when adding a model; a wrong number
  # here is a wrong number in the validator.
  #
  # `label` is deliberately untranslated. A model name is a machine fact, like
  # a version number, and is identical in both catalogues.
  #
  # An entry also describes the model's PARAMETER CONTRACT, because the OpenAI
  # families do not share one. Reasoning models reject `max_tokens` outright
  # (they need `max_completion_tokens`, which counts reasoning tokens too) and
  # reject `temperature` entirely. Sending either to one is a 400 on every
  # request — so this is not metadata, it is what makes the call well-formed.
  #
  #   token_param          max_tokens (default) | max_completion_tokens
  #   supports_temperature true (default) | false
  #   reasoning_efforts    omitted for a non-reasoning model; otherwise the
  #                        EXACT list that model accepts — they differ per
  #                        model, so this cannot be a shared constant.
  allowed_models:
    - id: gpt-4o-mini
      label: GPT-4o mini
      max_output_tokens: 16384
    - id: gpt-4o
      label: GPT-4o
      max_output_tokens: 16384
    - id: gpt-5.6-luna
      label: GPT-5.6 Luna
      max_output_tokens: 128000
      token_param: max_completion_tokens
      supports_temperature: false
      # `none` turns reasoning off and is the cheap, fast mode. Luna is the one
      # model here that offers it; Nano's equivalent floor is `minimal`.
      reasoning_efforts: [none, low, medium, high, xhigh, max]

    # gpt-5.4-nano is deliberately NOT enabled. It exists — the API lists
    # `gpt-5.4-nano-2026-03-17` among the chat-completions models — but no
    # published output ceiling could be found for it, and inventing one defeats
    # the only thing `max_output_tokens` is for. A guess that is too high is a
    # 400 on every request; too low silently truncates answers.
    #
    # To enable: confirm the output limit against the provider's model page,
    # then uncomment. The effort list below is what the docs describe; note it
    # has no `none`.
    # - id: gpt-5.4-nano
    #   label: GPT-5.4 Nano
    #   max_output_tokens: ???        # VERIFY before enabling
    #   token_param: max_completion_tokens
    #   supports_temperature: false
    #   reasoning_efforts: [minimal, low, medium, high]

# --- Data Processing ---
data_processing:
  chunk_size: 5000
  chunk_overlap: 800
  embedding_batch_size: 100

# --- Paths ---
paths:
  processed_data: web/processed_data

# --- Logging ---
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
