# ============================================
# SFDA Copilot - Application Configuration
# ============================================
# This is the SINGLE SOURCE OF TRUTH for application behavior.
# Secrets (API keys, database URLs) should be in .env file.
# ============================================

# --- Server Configuration ---
server:
  host: 0.0.0.0
  port: 5001
  debug: false  # Set to true for local development
  # Exchanges (one user question + one assistant answer) kept per conversation.
  # Held server-side in ConversationStore, NOT in the session cookie — the
  # comment here said "in session" long after that stopped being true.
  chat_history_length: 10

  # Whether the signup form accepts new accounts. An operator pauses
  # registrations from the console, which stores an override in
  # app_settings; an absent override means this value. Deployed true so
  # an instance that has never been paused is open.
  #
  # This is an APPLICATION control. It does not stop a caller talking to
  # the authentication provider directly with the publishable anon key —
  # see docs/OPERATIONS.md for the hard close.
  signup_enabled: true

  # Soft character budget for one conversation's stored history, measured as
  # serialized JSON. This exists so a conversation cannot grow without bound in
  # memory; it is NOT a model-context limit.
  #
  # Set it comfortably above a single exchange or it stops being a bound and
  # becomes a deletion policy. At 3,500 — the value inherited from when history
  # rode the 4KB session cookie — one ordinary answer exceeded the whole budget,
  # so each turn evicted the turns before it and a long answer emptied the
  # conversation outright. `chat_history_length` above never bound anything
  # because this always bound first.
  #
  # The newest exchange is never dropped to satisfy this (see
  # ConversationStore._truncate); an over-long message is clamped instead.
  #
  # Sized so that `chat_history_length` above is the limit that USUALLY BINDS.
  # That is the whole point of the number: a pair count is a window a reader can
  # predict ("the last ten exchanges"), whereas a character budget is one they
  # cannot, because it silently depends on how long the answers happened to be.
  # At 24,000 the budget still bound first — ten exchanges of this corpus's
  # answers run past it — so the pair count remained decorative and history
  # sawtoothed at roughly six or seven exchanges.
  #
  # Not larger, and the ceiling is cost rather than memory: 500 conversations
  # times this budget is ~30MB of RAM, which is nothing, but every stored
  # character is re-sent as INPUT TOKENS on every subsequent turn of that
  # conversation. 60,000 chars is ~10-15k tokens of history on top of ~3,900 of
  # retrieved context. Tripling it would triple the per-request bill to make
  # eviction rare in conversations that are already unusually long.
  chat_history_char_budget: 60000

  # Durable per-user chat history (TODO.md: "Save chat sessions per user").
  # Turns are recorded to Postgres, and GET /api/chat/history?c=<id> draws the
  # visible transcript back out of the same rows the prompt window is built
  # from — so a reload, a language toggle and a different device all show the
  # conversation the model remembers, with its citations openable rather than
  # neutralised. There is no "resume my last conversation" fallback any more:
  # the URL is the pointer (docs/per-tab-conversation-deep-linking-plan.md
  # §1), and the gap that fallback's cookie could not close on its own — a
  # reset followed immediately by a sign-out — closes as a side effect of
  # having no cookie left to look up (§2 Decision 1).
  chat_persistence: true

  # How many stored messages one hydration may draw. Clamped to [1, 200] by
  # clamp_load_limit. 200 messages is 100 answers, which is exactly the
  # MAX_TRACKED_ANSWERS cap in citations.js — do not raise one without the other,
  # or the oldest turns of a long session lose their citation controls silently.
  chat_hydration_limit: 50

  # Does the reader-facing notice mention the research archive?
  #
  # FALSE, and that is the current truth rather than an oversight: both
  # ARCHIVE_OWNER_SALT and ARCHIVE_SESSION_SALT are unset, so archive_keys()
  # returns (None, None) and chat_append_turn skips every archive insert. The
  # archive collects nothing, so the notice says nothing about it — a Settings
  # toggle reading "Research archive: ON" would tell a reader that a collection
  # process is running when none is.
  #
  # The opt-out toggle, the withdrawal column, the purge RPC, the retention CLI
  # and the export were all CUT on that basis, not merely deferred. Which means
  # setting either salt while this is false starts collecting text the reader
  # was never told about. `_warn_if_archive_is_undisclosed` refuses to let that
  # happen quietly; see the comment there, and TODO.md.
  archive_disclosed: false

  # Rate limiting
  rate_limit:
    per_day: 200
    per_hour: 50
    per_minute: 10
    chat_api: "15 per minute"
    # The transcript read, which fires on every sign-in, reload and language
    # toggle. It carries its OWN limit rather than inheriting the per_day /
    # per_hour / per_minute defaults above, and that is deliberate: an explicit
    # limit replaces the defaults in Flask-Limiter, so a page-load read cannot
    # spend the 200/day budget an office behind one NAT shares. Generous
    # because it is a cheap indexed read that draws the screen, and being
    # refused it leaves a reader looking at an empty conversation.
    history_api: "30 per minute"
    # The sidebar: list, select, rename, delete. One explicit limit for all four
    # rather than four, because they are one interaction — selecting a
    # conversation costs a select AND a transcript read, and a reader browsing
    # their history clicks through several in a row. Higher than history_api for
    # that reason: these are indexed reads against one owner's rows, and the two
    # writes are single-row updates. Like history_api this REPLACES the per_day /
    # per_hour / per_minute defaults, so ordinary navigation cannot spend the
    # 200/day budget an office behind one NAT shares with chat itself.
    sessions_api: "60 per minute"
    # Password recovery. Low on purpose: the endpoint is unauthenticated and
    # every accepted call sends mail, and GoTrue's own project-wide ceiling is
    # 30/hour — a caller must not be able to exhaust that in one minute.
    recover_api: "5 per minute"
    # Signup, server-mediated as of the registrations-pause work
    # (docs/registrations-pause-plan.md). Same reasoning as recover_api: an
    # unauthenticated endpoint that sends mail, sitting in front of GoTrue's
    # own project-wide ceiling rather than replacing it.
    signup_api: "5 per minute"
    # Full account export (GET /account/api/export). Low, per the security
    # pass's adopted limits (docs/profile-refactor-plan.md §4): it streams
    # every stored message a reader has, an exhaustive per-session read far
    # heavier than any other route on this surface. Keyed per reader, not per
    # IP (web/api/app.py's _account_rate_key) — an office behind one NAT must
    # not share this budget.
    export_api: "2 per 10 minutes"
    # Bulk conversation deletion (DELETE /account/api/conversations). Not
    # itemized in the plan's own rate-limit table (that one covers email,
    # password and export/deletion-of-the-ACCOUNT specifically) — set here by
    # the same reasoning: destructive and irreversible, so tighter than the
    # ordinary single-conversation sessions_api limit, but cheap enough (one
    # RPC round trip, no streamed read) not to need export's ceiling.
    account_bulk_delete_api: "10 per hour"
    # Notification Center (docs/notification-center-plan.md). The three
    # reader-facing limits mirror history_api/sessions_api's own reasoning:
    # each REPLACES the per_day/per_hour/per_minute defaults so ordinary
    # polling and inbox browsing cannot spend the shared office-NAT budget.
    # active fires on every page load and poll tick, so it is generous like
    # history_api; mark is cheap single-row writes, generous like sessions_api.
    notifications_active_api: "30 per minute"
    notifications_history_api: "20 per minute"
    notifications_mark_api: "60 per minute"
    # Admin broadcast send. Keyed per-administrator (web/api/admin.py's
    # _admin_notification_rate_key), NOT per-IP — the Limiter default would
    # let a compromised admin account spam via multiple IPs, and would make
    # several admins behind one office NAT share one budget. Low on purpose:
    # this fans a message out to every targeted reader at once.
    notification_broadcast_api: "10 per hour"

  # How long a successful GoTrue token verification may be reused, in seconds.
  #
  # THIS IS THE STATED REVOCATION WINDOW. Raising it lengthens the time a
  # revoked reader session keeps working. It applies to reader routes only —
  # /admin/* bypasses this cache entirely and is verified live on every
  # request, because the console can disable accounts and end sessions. Every
  # entry is additionally capped at the token's own `exp`, so this can shorten
  # a credential's life and never extend it.
  #
  # See docs/archive/2026-08-27_token-verification-cache.md §1 for the trade this represents, and
  # §1.4 for why 0 — not a positive number — is the shipped default.
  auth_token_cache:
    # 0 = OFF, and the shipped default. Single-flight still collapses
    # concurrent same-token verification at any value, including 0 — that
    # part is a concurrency control, not a cache, and it costs nothing in
    # freshness. Raising this above 0 takes the revocation trade in §1.4 and
    # must not be done without the measurement and the TODO.md entry that
    # section requires.
    ttl_seconds: 0

  # CORS origins (only used when debug=false)
  allowed_origins:
    - https://sfda-copilot.aifoudahub.com

# Notification Center (docs/notification-center-plan.md). Deploy-time default
# for the "Purge eligible" bulk convenience action's retention window — how
# many days a notification sits Deleted before that action includes it.
# Admin-overridable at runtime (web/services/notification_store.py's
# get_purge_retention_days/set_purge_retention_days, stored the same way as
# the generation settings: an app_settings override, absent key falls back
# to this default). Manual per-row/selected purge never consults this value.
notifications:
  purge_retention_days: 90

# --- Search Engine Configuration ---
search_engine:
  embedding_type: local  # 'openai' or 'local'
  embedding_model: all-mpnet-base-v2  # Model name for both local (SentenceTransformer) and OpenAI embeddings
  embedding_dimension: 768  # Used by the OpenAI client only; the local client derives its dimension from the loaded model
  
  # Search parameters
  k: 8  # Number of results to return
  semantic_weight: 0.5  # Weight for semantic search (0-1)
  lexical_weight: 0.5   # Weight for lexical search (0-1)
  semantic_multiplier: 10  # Candidate multiplier for semantic search
  lexical_multiplier: 10   # Candidate multiplier for lexical search

  # --- Relevance floor ---
  # A result must clear BOTH gates to reach the prompt or the source payload.
  # Without them, retrieval always returns k passages: an out-of-domain query
  # gets the least-bad eight rather than nothing.
  #
  # Units: semantic_score is exactly cosine similarity (query and chunk vectors
  # are both L2-normalised, so 1 - dist/2 reduces to cos) and lexical_score is
  # TF-IDF cosine, so `score` is a 50/50 blend of two cosines in [0,1]. That is
  # what makes an absolute cutoff meaningful at all.
  #
  # Both ship at 0.00 (disabled — behaviour identical to no floor). The source
  # panel's citation contract is what suppresses sources on an ungrounded
  # answer; this is a retrieval-quality improvement on top of it.
  #
  # DO NOT raise these without a held-out eval run: too high and in-domain
  # questions become false refusals, and the floor assumes AR→EN translation is
  # live (without OPENAI_API_KEY, Arabic queries embed untranslated and score
  # low across the board). See scripts/eval_retrieval.py.
  min_score: 0.00
  min_score_ratio: 0.00  # relative to the top hit; 0.0 disables

# --- OpenAI Configuration ---
openai:
  model: gpt-4o-mini
  temperature: 0.1
  max_tokens: 16384  # Max supported by gpt-4o-mini
  max_context_results: 8

  # Models an administrator may select at runtime. The console renders exactly
  # this list, and the server rejects anything absent from it.
  #
  # The split is the design: ADDING a model is a deploy decision, because it
  # changes what this application can be pointed at and needs someone to have
  # checked the ceiling below. CHOOSING among them is an operations decision,
  # made in the console by whoever is awake when a model degrades. An operator
  # who could type an arbitrary string could point production at a model that
  # does not exist, or at one whose output limit differs — and `max_tokens` is
  # not a free parameter: exceeding a model's ceiling is a 400 from the API on
  # every request, not a graceful degradation.
  #
  # `max_output_tokens` is enforced here rather than discovered at runtime,
  # because discovering it means finding out in production. VERIFY IT AGAINST
  # THE PROVIDER'S CURRENT DOCUMENTATION when adding a model; a wrong number
  # here is a wrong number in the validator.
  #
  # `label` is deliberately untranslated. A model name is a machine fact, like
  # a version number, and is identical in both catalogues.
  #
  # An entry also describes the model's PARAMETER CONTRACT, because the OpenAI
  # families do not share one. Reasoning models reject `max_tokens` outright
  # (they need `max_completion_tokens`, which counts reasoning tokens too) and
  # reject `temperature` entirely. Sending either to one is a 400 on every
  # request — so this is not metadata, it is what makes the call well-formed.
  #
  #   token_param          max_tokens (default) | max_completion_tokens
  #   supports_temperature true (default) | false
  #   reasoning_efforts    omitted for a non-reasoning model; otherwise the
  #                        EXACT list that model accepts — they differ per
  #                        model, so this cannot be a shared constant.
  allowed_models:
    - id: gpt-4o-mini
      label: GPT-4o mini
      max_output_tokens: 16384
    - id: gpt-4o
      label: GPT-4o
      max_output_tokens: 16384
    - id: gpt-5.6-luna
      label: GPT-5.6 Luna
      max_output_tokens: 128000
      token_param: max_completion_tokens
      supports_temperature: false
      # `none` turns reasoning off and is the cheap, fast mode. Luna is the one
      # model here that offers it; Nano's equivalent floor is `minimal`.
      reasoning_efforts: [none, low, medium, high, xhigh, max]

    # gpt-5.4-nano is deliberately NOT enabled. It exists — the API lists
    # `gpt-5.4-nano-2026-03-17` among the chat-completions models — but no
    # published output ceiling could be found for it, and inventing one defeats
    # the only thing `max_output_tokens` is for. A guess that is too high is a
    # 400 on every request; too low silently truncates answers.
    #
    # To enable: confirm the output limit against the provider's model page,
    # then uncomment. The effort list below is what the docs describe; note it
    # has no `none`.
    # - id: gpt-5.4-nano
    #   label: GPT-5.4 Nano
    #   max_output_tokens: ???        # VERIFY before enabling
    #   token_param: max_completion_tokens
    #   supports_temperature: false
    #   reasoning_efforts: [minimal, low, medium, high]

# --- Data Processing ---
data_processing:
  chunk_size: 5000
  chunk_overlap: 800
  embedding_batch_size: 100

# --- Paths ---
paths:
  processed_data: web/processed_data

# --- Logging ---
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
