# Tool configuration only — this repo is a Flask app, not a distributed
# package, so there is deliberately no [build-system]/[project] section here.

[tool.ruff]
# py310, not the dev machine's 3.14 or CI's 3.12: the VPS production server
# runs Python 3.10.12, and that is the real floor every commit must run on.
target-version = "py310"
line-length = 100
extend-exclude = [
    "data",
    "web/processed_data",
    "web/api/.venv",
    ".venv",
    "web/tests/data",
    "memory-bank",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (real-bug-shaped patterns)
    "UP",  # pyupgrade (modern syntax, consistent with existing `from __future__ import annotations`)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-native rules
]
ignore = [
    "E501",           # line-length is the formatter's job, not the linter's
    "RUF001", "RUF002", "RUF003", # ambiguous-unicode-character — this app is
    # bilingual (Arabic RTL content, see web/i18n/ar.yaml) and uses intentional
    # typographic en-dashes/no-break spaces; these findings are false positives
    # here, not bugs.
]

[tool.ruff.lint.per-file-ignores]
# E402: these deliberately import after setup code that must run first (sys.path
# insertion, stdout/stderr UTF-8 reconfiguration for Arabic output, load_dotenv(),
# or logger configuration that later imports rely on) — reordering would break them.
"scripts/eval_citations.py" = ["E402"]
"scripts/eval_retrieval.py" = ["E402"]
"scripts/smoke_real.py" = ["E402"]
"web/api/app.py" = ["E402"]
"web/services/data_processing.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["web"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10" # production floor — see [tool.ruff]'s target-version comment
ignore_missing_imports = true
exclude = [
    "data/",
    "web/processed_data/",
    "web/api/.venv/",
    "web/tests/",
    "scripts/", # hand-run/experimental, not depended on by any request path
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false # lenient/gradual — do not force annotation coverage

[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "sentence_transformers.*",
    "langchain.*",
    "langchain_text_splitters.*",
    "sklearn.*",
]
ignore_missing_imports = true
